name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax & Compilation
        run: |
          python -m py_compile app.py config.py activity.py ai_client.py conversation.py database.py commands.py safety.py

      - name: Run Test Suite
        env:
          TELEGRAM_API_ID: "123456"
          TELEGRAM_API_HASH: "mock_api_hash"
          AI_API_KEY: "mock_ai_key"
          DATABASE_PROVIDER: "sqlite"
        run: |
          pytest -v tests

  docker-build:
    name: Docker Build Check
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run / No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: telegram-auto-reply:test
